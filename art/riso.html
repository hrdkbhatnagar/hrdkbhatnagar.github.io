<!doctype html>
<html lang="en"><meta charset="utf-8"><title>art</title>
<style>
html,body{margin:0;background:#e7e1d5;color:#1e2128;font:14px system-ui}
canvas{display:block}
</style><canvas id="c"></canvas>
<script src="geometry.js"></script>
<script>
'use strict';
// Risograph art for the website: thumbnails and hand-drawn marks, printed in two inks, slate and clay.
// Open without a query for a proof sheet of every asset; art/export.mjs bakes each one
// with ?asset=<name>&size=<desktop|mobile>&dpr=<n> to public/images/riso/.
//
// The print and craft kits below are from riso-windowseat by sevenevesai (MIT License,
// Copyright (c) 2026 sevenevesai; see art/LICENSE-riso-windowseat), generated by its
// tools/new-riso.mjs. The art block, the extra inks and the asset runtime are this site's.
const CSS=720, W=1080, OUT=1080, K=1, PITCH=4.6, DUR=1;
const PAPER = '#F2EDE3';
const INK = {
  blue:   '#0078BF',
  pink:   '#FF48B0',
  yellow: '#FFE800',
  green:  '#00A95C',
  orange: '#FF6C2F',
  violet: '#765BA7',
  indigo: '#2E3192',
  // the site's two inks: a warm slate, and clay for the point of each picture
  slate:  '#3F3E3A',
  clay:   '#CC785C',
};

/* Screen angles as rational tangents (b/a). A rotated dot grid only repeats
   seamlessly on a rational tangent, so these are the real angles rather than
   the nominal 15/45/75 — any other value leaves a visible seam where the
   pattern tile wraps. */
const SCREEN = {
  blue:   { a: 4, b: 1 },   // 14.0°
  pink:   { a: 1, b: 4 },   // 76.0°
  yellow: { a: 1, b: 0 },   //  0.0°
  green:  { a: 1, b: 1 },   // 45.0°
  orange: { a: 2, b: 1 },   // 26.6°
  violet: { a: 1, b: 2 },   // 63.4°
  indigo: { a: 1, b: 1 },   // 45.0°
  slate:  { a: 1, b: 1 },   // 45.0°
  clay:   { a: 1, b: 2 },   // 63.4°
};

/* Registration: each plate misses by a fixed amount, in device px. */
const REG = {
  blue:   [ 1.5, -1.0], pink:   [-2.5,  2.0], yellow: [ 2.0,  1.5],
  green:  [-1.5, -1.5], orange: [ 1.0,  2.0], violet: [-2.0, -1.0],
  indigo: [ 0.0,  0.0],
  slate:  [ 0.0,  0.0], clay:   [ 0.7, -0.5],   // in CSS px here; scaled by dpr
};

const CX = W / 2, CY = W / 2;

/* ── deterministic randomness ─────────────────────────────────────────────── */

function mulberry32(a) {
  return function () {
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
const rngFor = (key) => mulberry32(hash(key));

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, u) => a + (b - a) * u;

function cv(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

/* ── halftone screens ─────────────────────────────────────────────────────────
   For screen angle tanθ = b/a the dot lattice is generated by the orthogonal
   vectors P/√(a²+b²)·(a,b) and P/√(a²+b²)·(−b,a). That lattice contains
   (P√(a²+b²), 0), so a square tile of side S = P√(a²+b²) repeats seamlessly and
   holds exactly a²+b² dots.

   Screens are anchored to canvas space, never to the object being drawn. A
   screen that rides along with its subject makes the texture crawl, which is
   the single most recognisable way this look goes wrong.                     */

const screens = {};

function buildScreen(name, pitch) {
  const { a, b } = SCREEN[name];
  const n = a * a + b * b;
  const S = Math.max(2, Math.round((pitch || PITCH) * Math.sqrt(n)));
  const P = S / Math.sqrt(n);              // effective pitch after rounding
  const u = P / Math.sqrt(n);
  const v1 = [u * a, u * b], v2 = [-u * b, u * a];

  // Lattice points reduced into the tile, plus wrapped neighbours so dots that
  // straddle an edge are drawn on both sides.
  const pts = [];
  for (let m = -n; m <= n; m++) {
    for (let k = -n; k <= n; k++) {
      const x = m * v1[0] + k * v2[0], y = m * v1[1] + k * v2[1];
      const wx = ((x % S) + S) % S, wy = ((y % S) + S) % S;
      if (!pts.some(p => Math.abs(p[0] - wx) < 0.01 && Math.abs(p[1] - wy) < 0.01)) pts.push([wx, wy]);
    }
  }
  const wrapped = [];
  for (const [x, y] of pts) for (const dx of [-S, 0, S]) for (const dy of [-S, 0, S]) wrapped.push([x + dx, y + dy]);

  // Threshold tile: a pixel takes ink when coverage exceeds π·d²/P², which is
  // the coverage at which a dot of radius d would reach that pixel.
  const th = new Float32Array(S * S);
  for (let y = 0; y < S; y++) {
    for (let x = 0; x < S; x++) {
      let d2 = Infinity;
      for (const [px, py] of wrapped) {
        const dx = x + 0.5 - px, dy = y + 0.5 - py, q = dx * dx + dy * dy;
        if (q < d2) d2 = q;
      }
      th[y * S + x] = clamp(Math.PI * d2 / (P * P), 0, 1);
    }
  }
  return { S, P, pts, wrapped, th, patterns: new Map() };
}

function screenOf(name, pitch) {
  const key = name + '@' + (pitch || PITCH);
  return screens[key] || (screens[key] = buildScreen(name, pitch));
}

/** Screen a greyscale coverage canvas into hard dots. Bake-time only. */
function screenCoverage(covCanvas, name, pitch) {
  const sc = screenOf(name, pitch);
  const w = covCanvas.width, h = covCanvas.height;
  const src = covCanvas.getContext('2d').getImageData(0, 0, w, h);
  const s = src.data;
  for (let y = 0; y < h; y++) {
    const row = (y % sc.S) * sc.S;
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      const cover = s[i + 3] / 255;
      s[i + 3] = cover > sc.th[row + (x % sc.S)] ? 255 : 0;
    }
  }
  const out = cv(w, h);
  out.getContext('2d').putImageData(src, 0, 0);
  return out;
}

/* ── paper ────────────────────────────────────────────────────────────────────
   Cloudy mottling rather than fine grain: the reference shows blotches a few
   hundred px across at low contrast. Baked once, never recomputed, because any
   per-frame regeneration flickers.                                           */

let paper = null;

function bakePaper() {
  const c = cv(OUT, OUT), x = c.getContext('2d');
  x.setTransform(K, 0, 0, K, 0, 0);
  x.fillStyle = PAPER; x.fillRect(0, 0, W, W);

  const r = rngFor('paper');

  // Mottling is a warm wash with noisy alpha, not a neutral multiply: greyscale
  // noise multiplied over cream desaturates it and reads as smoke rather than
  // paper. Keep it subtle at full size and only obvious when zoomed.
  for (const [res, maxA] of [[30, 0.10], [72, 0.075], [165, 0.05]]) {
    const n = cv(res, res), nx = n.getContext('2d');
    const img = nx.createImageData(res, res);
    for (let i = 0; i < res * res; i++) {
      img.data[i * 4] = 0xB4; img.data[i * 4 + 1] = 0xA6; img.data[i * 4 + 2] = 0x8C;
      img.data[i * 4 + 3] = Math.pow(r(), 1.8) * 255 * maxA;
    }
    nx.putImageData(img, 0, 0);
    x.save();
    x.imageSmoothingEnabled = true;
    x.imageSmoothingQuality = 'high';
    x.drawImage(n, 0, 0, W, W);
    x.restore();
  }

  x.save();                                  // fibres
  x.strokeStyle = '#8a7f6a';
  for (let i = 0; i < 420; i++) {
    const px = r() * W, py = r() * W, len = 5 + r() * 22, ang = r() * Math.PI;
    x.globalAlpha = 0.008 + r() * 0.016;
    x.lineWidth = 0.5 + r() * 0.7;
    x.beginPath();
    x.moveTo(px, py);
    x.quadraticCurveTo(px + Math.cos(ang) * len * 0.5 + (r() - 0.5) * 5,
                       py + Math.sin(ang) * len * 0.5 + (r() - 0.5) * 5,
                       px + Math.cos(ang) * len, py + Math.sin(ang) * len);
    x.stroke();
  }
  x.restore();

  x.save();                                  // flecks
  for (let i = 0; i < 2200; i++) {
    x.globalAlpha = 0.012 + r() * 0.03;
    x.fillStyle = r() < 0.55 ? '#7d7362' : '#ffffff';
    x.beginPath();
    x.arc(r() * W, r() * W, 0.4 + r() * 1.0, 0, Math.PI * 2);
    x.fill();
  }
  x.restore();
  return c;
}

/* ── scene drawing helpers ────────────────────────────────────────────────────
   Scenes draw coverage in 1080-space and alpha is tone, so 0.4 means a 40%
   dot screen. Shape helpers carry hand wobble; nothing here is a true circle
   or a straight line.                                                        */

function makeWob(rng, harmonics = 3) {
  const h = [];
  for (let i = 0; i < harmonics; i++) h.push([2 + i, rng() * 2 - 1, rng() * Math.PI * 2]);
  return (th) => h.reduce((s, [k, a, p]) => s + a * Math.sin(k * th + p), 0) / harmonics;
}

const tone = (g, a) => { g.globalAlpha = clamp(a, 0, 1); };


/* ── scene registry ───────────────────────────────────────────────────────── */

const SCENES = {};
const scene = (id, def) => { SCENES[id] = Object.assign({ id, live: null }, def); };

const baked = new Map();

/**
 * Bake a scene to one opaque bitmap: every plate screened, tinted, offset and
 * multiplied onto white, ready to multiply over paper.
 *
 * Baked at its display size, never scaled afterwards. Resampling a halftoned
 * bitmap beats the dot grid against the pixel grid and moirés; real print
 * screens at final size too.
 */
function bakeScene(id, size) {
  const key = id + '@' + size;
  if (baked.has(key)) return baked.get(key);
  const sc = SCENES[id];
  const k = size / W;
  const out = cv(size, size), o = out.getContext('2d');
  o.fillStyle = '#fff';
  o.fillRect(0, 0, size, size);

  const cover = cv(size, size), g = cover.getContext('2d');
  for (const ink of sc.inks) {
    const plate = ink;
    g.setTransform(k, 0, 0, k, 0, 0);
    g.clearRect(0, 0, W, W);
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'source-over';
    g.fillStyle = g.strokeStyle = '#000';
    g.lineCap = 'round';
    g.lineJoin = 'round';
    g.save();
    sc.plates(g, ink, rngFor(id + ':' + ink), rngFor(id + ':shape'));
    g.restore();
    starve(g, rngFor(id + ':' + ink + ':void'));

    const dots = screenCoverage(cover, plate);
    const tin = cv(size, size), tx = tin.getContext('2d');
    tx.drawImage(dots, 0, 0);
    tx.globalCompositeOperation = 'source-in';
    tx.fillStyle = INK[plate];
    tx.fillRect(0, 0, size, size);

    const [rx, ry] = REG[plate];
    o.save();
    o.globalCompositeOperation = 'multiply';
    o.drawImage(tin, rx, ry);
    o.restore();
  }
  baked.set(key, out);
  return out;
}

/** Ink starvation: evenly filled solids read as laser print, so drop flecks. */
function starve(g, rng) {
  g.save();
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = 'destination-out';
  const w = g.canvas.width, n = Math.round(w * 1.1);
  for (let i = 0; i < n; i++) {
    g.globalAlpha = 0.2 + rng() * 0.55;
    g.beginPath();
    g.arc(rng() * w, rng() * w, (0.5 + rng() * 2.0) * K, 0, Math.PI * 2);
    g.fill();
  }
  g.restore();
}

/* ── craft kit ────────────────────────────────────────────────────────────────
   Drawing vocabulary for scene plates. Copy this whole block into a new film,
   between starve() and the scenes.

   Shapes are Path2D values rather than marks on the context, so one shape can
   be filled on one plate, knocked out of another and hatched on a third. That
   is what plate discipline needs, and it removes the usual trap of rebuilding
   a shape per ink and having the knockout miss.

   Everything draws coverage in 1080-space: fill style is already '#000' and
   globalAlpha is tone, so 0.4 means a 40% dot screen.                        */

const TAU = Math.PI * 2;

/* — shape builders ——————————————————————————————————————————————— */

/** Catmull-Rom through pts, as a dense polyline. */
function curve(pts, closed, per) {
  per = per || 12;
  const n = pts.length, out = [];
  const at = (i) => pts[closed ? (i + n * 2) % n : clamp(i, 0, n - 1)];
  const last = closed ? n : n - 1;
  for (let i = 0; i < last; i++) {
    const p0 = at(i - 1), p1 = at(i), p2 = at(i + 1), p3 = at(i + 2);
    for (let k = 0; k < per; k++) {
      const u = k / per, u2 = u * u, u3 = u2 * u;
      out.push([
        0.5 * (2 * p1[0] + (p2[0] - p0[0]) * u + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * u2
               + (3 * p1[0] - p0[0] - 3 * p2[0] + p3[0]) * u3),
        0.5 * (2 * p1[1] + (p2[1] - p0[1]) * u + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * u2
               + (3 * p1[1] - p0[1] - 3 * p2[1] + p3[1]) * u3),
      ]);
    }
  }
  if (!closed) out.push(pts[n - 1].slice());
  return out;
}

/** Points around an ellipse, for feeding cut(). */
function ringPts(x, y, rx, ry, n, rot) {
  const out = [], c = Math.cos(rot || 0), s = Math.sin(rot || 0);
  for (let i = 0; i < n; i++) {
    const th = i / n * TAU, px = Math.cos(th) * rx, py = Math.sin(th) * ry;
    out.push([x + px * c - py * s, y + px * s + py * c]);
  }
  return out;
}

/**
 * Closed hand-cut contour through control points: the silhouette builder.
 * A shape made of arcs and ellipses reads as clip art however good the screen
 * is, because every edge has the same machine curvature.
 *   o.amp   edge waver in px — 2 is a drawn line, 8 is torn stock
 *   o.tear  0..1 chance per sample of a deeper bite inward
 */
function cut(pts, rng, o) {
  o = o || {};
  const amp = o.amp === undefined ? 3 : o.amp, tear = o.tear || 0;
  const c = curve(pts, true, o.per || 10), n = c.length;
  let area = 0;
  for (let i = 0; i < n; i++) {
    const a = c[i], b = c[(i + 1) % n];
    area += a[0] * b[1] - b[0] * a[1];
  }
  const sgn = area > 0 ? 1 : -1;            // keep the normal pointing outward

  /* Displace along the normal, then smooth: an unsmoothed tear lands on one
     sample and reads as damage rather than as a bay in the edge. */
  const w1 = makeWob(rng, 4), w2 = makeWob(rng, 9), d = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const th = i / n * TAU;
    d[i] = (w1(th) + w2(th * 3) * 0.3) * amp;
    if (tear && rng() < tear) d[i] -= amp * (1.4 + rng() * 1.6);
  }
  for (let pass = 0; pass < 2; pass++) {
    const s = Float32Array.from(d);
    for (let i = 0; i < n; i++) d[i] = (s[(i - 1 + n) % n] + s[i] * 2 + s[(i + 1) % n]) * 0.25;
  }

  const p = new Path2D();
  for (let i = 0; i < n; i++) {
    const a = c[(i - 1 + n) % n], b = c[(i + 1) % n];
    let tx = b[0] - a[0], ty = b[1] - a[1];
    const m = Math.hypot(tx, ty) || 1; tx /= m; ty /= m;
    const x = c[i][0] + sgn * ty * d[i], y = c[i][1] - sgn * tx * d[i];
    i ? p.lineTo(x, y) : p.moveTo(x, y);
  }
  p.closePath();
  return p;
}

/**
 * Variable-width ribbon along a path, as a fillable shape. Canvas has no
 * pressure, so a constant lineWidth is the default and it is what makes stems,
 * branches, whiskers and rigging read as wire. wfn(u) returns half-width.
 */
function nib(pts, wfn, o) {
  o = o || {};
  const c = o.raw ? pts : curve(pts, false, o.per || 10);
  const n = c.length, L = [], R = [];
  for (let i = 0; i < n; i++) {
    const a = c[Math.max(0, i - 1)], b = c[Math.min(n - 1, i + 1)];
    let tx = b[0] - a[0], ty = b[1] - a[1];
    const m = Math.hypot(tx, ty) || 1; tx /= m; ty /= m;
    const w = Math.max(0.01, wfn(i / (n - 1)));
    L.push([c[i][0] - ty * w, c[i][1] + tx * w]);
    R.push([c[i][0] + ty * w, c[i][1] - tx * w]);
  }
  const p = new Path2D();
  p.moveTo(L[0][0], L[0][1]);
  for (let i = 1; i < n; i++) p.lineTo(L[i][0], L[i][1]);
  for (let i = n - 1; i >= 0; i--) p.lineTo(R[i][0], R[i][1]);
  p.closePath();
  return p;
}

/** Width profiles for nib(). */
const wTip = (w) => (u) => w * (1 - u * u);                       // full, lifting to a point
const wSwell = (w, at, k) => (u) => w * Math.exp(-Math.pow((u - at) / (k || 0.35), 2));
const wLeaf = (w, skew) => (u) => w * Math.pow(Math.sin(Math.PI * Math.pow(u, skew || 0.55)), 1.15);

/**
 * Calligraphic width from a held nib: widest where the path runs across the
 * nib's axis, thinnest where it runs along it. This is where hand-drawn line
 * weight comes from, and it is what makes a contour read as drawn rather than
 * traced. Pass the same polyline you give nib(), with raw: true.
 */
function wNib(c, w0, ang, floor) {
  const n = c.length, f = floor === undefined ? 0.22 : floor;
  return (u) => {
    const i = clamp(Math.round(u * (n - 1)), 0, n - 1);
    const a = c[Math.max(0, i - 1)], b = c[Math.min(n - 1, i + 1)];
    const th = Math.atan2(b[1] - a[1], b[0] - a[0]);
    return w0 * (f + (1 - f) * Math.abs(Math.sin(th - ang)));
  };
}

/**
 * A horizon band closed to the bottom of the frame: hills, treeline, roofline,
 * wave. Stack several at falling tone and the air between them reads as depth.
 *   o.amp  height of the undulation   o.freq  how many bumps across the frame
 *   o.tilt fraction of W the far end drops   o.teeth adds a jagged octave
 */
function ridgeAt(y, o) {
  const amp = o.amp === undefined ? 60 : o.amp;
  const w = makeWob(o.rng, o.harm || 5), t = o.teeth ? makeWob(o.rng, 7) : null;
  return (u) => y + w(u * (o.freq || 5)) * amp + (o.tilt || 0) * (u - 0.5) * W
                + (t ? t(u * 37) * amp * 0.22 : 0);
}

/**
 * Mountain profile: overlapping triangular peaks with a jagged octave on top,
 * because a skyline built from smooth harmonics always reads as hills however
 * tall it is. Same u -> y contract as ridgeAt, so ridge() takes either.
 */
function peaksAt(y, o) {
  const amp = o.amp === undefined ? 90 : o.amp, n = o.n || 5, ps = [];
  for (let i = 0; i < n; i++) {
    ps.push({ c: (i + 0.5) / n + (o.rng() - 0.5) * 0.7 / n,
              h: amp * (0.4 + o.rng() * 0.6), w: (0.55 + o.rng() * 0.9) / n,
              lean: (o.rng() - 0.5) * 0.7 });
  }
  const jag = makeWob(o.rng, 8);
  return (u) => {
    let top = y;
    for (const p of ps) {
      const d = (u - p.c) / p.w;
      const yy = y - p.h * Math.max(0, 1 - Math.abs(d)) * (1 + p.lean * (d > 0 ? 1 : -1));
      if (yy < top) top = yy;
    }
    return top + jag(u * 26) * amp * 0.06;
  };
}

/** x across the frame -> the u that ridgeAt takes, for planting on a skyline. */
const ridgeU = (x) => (x + 60) / (W + 120);

function ridge(y, o) {
  o = o || {};
  const f = typeof y === 'function' ? y : ridgeAt(y, o);
  const n = o.n || 120, p = new Path2D();
  p.moveTo(-60, W + 60);
  for (let i = 0; i <= n; i++) p.lineTo(-60 + i / n * (W + 120), f(i / n));
  p.lineTo(W + 60, W + 60);
  p.closePath();
  return p;
}

/* — paint operations ————————————————————————————————————————————— */

/** Fill a shape at a tone. */
function print(g, path, a) { tone(g, a === undefined ? 1 : a); g.fill(path); }

/** Knock a shape out of the plate underneath it, at full coverage.
    A knockout drawn at a tone leaves the screen's gaps behind, so the plate
    below shows through the holes — always clear solid. */
function carve(g, path) {
  g.save();
  g.globalAlpha = 1;
  g.globalCompositeOperation = 'destination-out';
  g.fill(path);
  g.restore();
}

/**
 * Print a shape at an exact tone, clearing whatever the plate already holds
 * beneath it. Tones on one plate add where they overlap, so a stack of ridges
 * drawn back to front ends up solid at the bottom of the frame — which looks
 * like a colour band rather than land. Every plane in a depth stack goes
 * through here.
 */
function plane(g, path, a) { carve(g, path); print(g, path, a); }

/** Outline a shape. Line work fades on width and alpha, never on coverage. */
function keyline(g, path, w, a) {
  tone(g, a === undefined ? 1 : a);
  g.lineWidth = w === undefined ? 3 : w;
  g.stroke(path);
}

/**
 * Tone ramp inside a shape — a coverage gradient, which the screen turns into
 * a dot-size ramp. This is the signature riso gesture and neither film uses it.
 * Baked plates only: a live inkPass screens at one flat coverage, so a gradient
 * there prints smooth, which is the thing the brief forbids.
 *   o.stops  [[at, tone], ...]      o.x0,y0,x1,y1  linear
 *   o.x,y,r0,r  radial
 */
function shade(g, path, o) {
  g.save();
  if (path) g.clip(path);
  const grd = o.r !== undefined
    ? g.createRadialGradient(o.x, o.y, o.r0 || 0, o.x, o.y, o.r)
    : g.createLinearGradient(o.x0, o.y0, o.x1, o.y1);
  for (const [at, a] of o.stops) grd.addColorStop(clamp(at, 0, 1), 'rgba(0,0,0,' + clamp(a, 0, 1) + ')');
  if (o.cut) g.globalCompositeOperation = 'destination-out';
  g.globalAlpha = 1;
  g.fillStyle = grd;

      const shapes = pairs.map(([c, r], i) => {

        return { x, xr, tc, tr, rep: slab(x, tc, x + w, BASE + 0.5, sr), run: slab(xr, tr, xr + w, BASE + 0.5, sr), lost: slab(xr, tc, xr + w, tr, sr, 0.4) };
      });
      const axis = axisPath(sr);
      if (ink === 'slate' && pass === 'tone') shapes.forEach((p) => print(g, p.rep, 0.3));
      if (ink === 'slate' && pass === 'mass') shapes.forEach((p) => g.fill(p.run));
      if (ink === 'slate' && pass === 'line') g.fill(axis);
      if (ink === 'clay' && pass === 'mass') shapes.forEach((p) => g.fill(p.lost));
    },
  }),

  // Absorption: the "starts with S" feature fires on every S-word except "short"
  'fig-absorption': Object.assign({}, FIG, {
    draw(g, ink, rng, sr, pass) {
      const hs = [0.26, 0.21, 0.18, 0.94, 0.22, 0.27];
      const slot = 40, w = 17, x0 = 30;
      const bars = hs.map((h, i) => { const x = x0 + i * slot, top = BASE - h * H; return { x, top, path: slab(x, top, x + w, BASE + 0.5, sr) }; });
      const axis = axisPath(sr);
      if (ink === 'slate' && pass === 'mass') bars.forEach((b, i) => { if (i !== 3) g.fill(b.path); });
      if (ink === 'slate' && pass === 'line') g.fill(axis);
      if (ink === 'clay' && pass === 'mass') g.fill(bars[3].path);
    },
  }),

  // Compaction: with each compaction the summary keeps fewer of the task's three rules (clay climbs
  // towards the dashed "all three gone"), while fewer and fewer runs last that long (the pale skyline)
  'fig-compaction': Object.assign({}, FIG, {
    draw(g, ink, rng, sr, pass) {
      const dropped = [0.92, 1.2, 1.33, 1.48, 1.46, 1.67, 1.81, 1.81, 1.79, 1.95, 2.1, 2.32, 2.29, 2.35, 2.42, 2.47,
        2.5, 2.53, 2.52, 2.57, 2.58, 2.52, 2.54, 2.54, 2.63, 2.64, 2.65, 2.69, 2.67, 2.66, 2.74, 2.74, 2.75];
      const runs = [126, 123, 118, 112, 90, 73, 68, 62, 57, 50, 44, 40, 37, 35, 35, 33,
        31, 31, 30, 29, 28, 25, 24, 24, 22, 22, 19, 18, 17, 16, 15, 15, 15];
      const n = dropped.length, x0 = 22, slot = (262 - x0) / n, ceil = BASE - H;
      const xAt = (i) => x0 + (i + 0.5) * slot, yAt = (v) => BASE - (v / 3) * H;
      // the runs that reach each compaction, three compactions to a bar
      const skyline = new Path2D();
      for (let i = 0; i < n; i += 3) {
        const r = (runs[i] + runs[i + 1] + runs[i + 2]) / 3, top = BASE - (r / 126) * H * 0.52;
        skyline.addPath(slab(x0 + i * slot + 1.6, top, x0 + (i + 3) * slot - 1.6, BASE + 0.5, sr));
      }
      const axis = axisPath(sr);
      const ceiling = dashes(x0, x0 + n * slot, ceil, sr);
      const line = pulled(dropped.map((v, i) => [xAt(i), yAt(v)]), 2.4, sr);
      const dots = new Path2D();
      dropped.forEach((v, i) => { if (i % 4 === 0 || i === n - 1) dots.addPath(cut(ringPts(xAt(i), yAt(v), 3.8, 3.8, 8), sr, { amp: 0.35 })); });
      if (ink === 'slate' && pass === 'tone') print(g, skyline, 0.26);
      if (ink === 'slate' && pass === 'line') { g.fill(axis); g.fill(ceiling); }
      if (ink === 'clay' && pass === 'mass') g.fill(dots);
      if (ink === 'clay' && pass === 'line') g.fill(line);
    },
  }),

  // Sandbagging: Figure 1's scatter. Prior model organisms (slate) trade robustness for retention;
  // training lifts the base model (pale) straight up to the top (clay)
  'fig-sandbagging': Object.assign({}, FIG, {
    draw(g, ink, rng, sr, pass) {
      const xAt = (ret) => 26 + (ret / 85) * 232, yAt = (rob) => BASE - ((rob - 40) / 62) * H;
      const prior = [[8, 84.5], [21.5, 65], [49.5, 60.5], [55, 58.5], [76, 68], [64.5, 73], [61, 81]];
      const base = [71, 47], ours = [71, 96];
      const dot = (p, r) => cut(ringPts(xAt(p[0]), yAt(p[1]), r, r, 9), sr, { amp: 0.4 });
      const others = new Path2D();
      prior.forEach((p) => others.addPath(dot(p, 7.6)));
      const bx = xAt(base[0]), by = yAt(base[1]);
      const baseMark = slab(bx - 9, by - 9, bx + 9, by + 9, sr, 0.5);
      const ox = xAt(ours[0]), oy = yAt(ours[1]);
      const oursMark = cut([[ox - 13, oy - 8], [ox - 13, oy - 8], [ox + 13, oy - 8], [ox + 13, oy - 8], [ox, oy + 12], [ox, oy + 12]], sr, { amp: 0.4, per: 6 });
      const lift = new Path2D();
      for (let y = by - 12; y > oy + 15; y -= 11) lift.addPath(pulled([[bx, y], [bx - 0.3, Math.max(oy + 15, y - 6.5)]], 1.5, sr));
      const axis = axisPath(sr);
      if (ink === 'slate' && pass === 'tone') print(g, baseMark, 0.3);
      if (ink === 'slate' && pass === 'mass') g.fill(others);
      if (ink === 'slate' && pass === 'line') g.fill(axis);
      if (ink === 'clay' && pass === 'mass') g.fill(oursMark);
      if (ink === 'clay' && pass === 'line') g.fill(lift);
    },
  }),

  /* — marks ——————————————————————————————————————————————————————————————— */

  // The divider: one neuron, its axon run across the page
  'neuron-rule': {
    w: 860, h: 52, sizes: { desktop: [812, 49] }, inks: ['clay', 'slate'],
    draw(g, ink, rng, sr, pass) {
      if (ink === 'slate' && pass === 'line') fill(g, 'neuron-rule');
      if (ink === 'clay' && pass === 'line') {
        g.fill(new Path2D(GEO['neuron-rule'].fills[1]));
        for (const [x, y, r] of GEO['neuron-rule'].circles) { g.beginPath(); g.arc(x, y, r * 1.3, 0, TAU); g.fill(); }
      }
    },
  },
  'neuron-rule-short': {
    w: 360, h: 52, sizes: { mobile: [350, 51] }, inks: ['clay', 'slate'],
    draw(g, ink, rng, sr, pass) {
      if (ink === 'slate' && pass === 'line') fill(g, 'neuron-rule-short');
      if (ink === 'clay' && pass === 'line') {
        g.fill(new Path2D(GEO['neuron-rule-short'].fills[1]));
        for (const [x, y, r] of GEO['neuron-rule-short'].circles) { g.beginPath(); g.arc(x, y, r * 1.3, 0, TAU); g.fill(); }
      }
    },
  },

  // Under the name: a quick brush stroke under its start only, lifting as it ends.
  // Cropped to the stroke, so a reveal spends its whole duration drawing ink.
  'underline': {
    w: 132, h: 22, sizes: { desktop: [132, 22] }, inks: ['clay'],
    draw(g, ink, rng, sr, pass) {
      if (pass !== 'mass') return;
      const c = curve([[4, 13.5], [40, 12.2], [86, 11.6], [128, 9.4]], false, 16);
      g.fill(nib(c, (u) => 2.4 * (0.55 + 0.45 * Math.min(1, u * 6)) * (1 - 0.92 * Math.pow(u, 2.2)), { raw: true }));
    },
  },
  // The same stroke as a halftone at rising coverage: the name's stroke inks up through these
  ...Object.fromEntries([0.22, 0.45, 0.7].map((tone, i) => [`underline-t${i + 1}`, {
    w: 132, h: 22, sizes: { desktop: [132, 22] }, inks: ['clay'],
    draw(g, ink, rng, sr, pass) {
      if (pass !== 'tone') return;
      const c = curve([[4, 13.5], [40, 12.2], [86, 11.6], [128, 9.4]], false, 16);
      print(g, nib(c, (u) => 2.4 * (0.55 + 0.45 * Math.min(1, u * 6)) * (1 - 0.92 * Math.pow(u, 2.2)), { raw: true }), tone);
    },
  }])),
  'rule': {
    w: 860, h: 6, sizes: { desktop: [812, 6] }, inks: ['slate'],
    draw(g, ink, rng, sr, pass) { if (pass === 'line') fill(g, 'rule'); },
  },
  'arrow': {
    w: 40, h: 17, sizes: { desktop: [26, 11] }, inks: ['slate'],
    draw(g, ink, rng, sr, pass) { if (pass === 'line') fill(g, 'arrow'); },
  },
};

/** Smooth noise in 0..1 at a given cell size, upscaled from a small random grid. */
function mottleField(w, h, cell, rng) {
  const gw = Math.max(2, Math.ceil(w / cell) + 1), gh = Math.max(2, Math.ceil(h / cell) + 1);
  const n = cv(gw, gh), nx = n.getContext('2d'), img = nx.createImageData(gw, gh);
  for (let i = 0; i < gw * gh; i++) { const v = rng() * 255; img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = v; img.data[i * 4 + 3] = 255; }
  nx.putImageData(img, 0, 0);
  const up = cv(w, h), ux = up.getContext('2d');
  ux.imageSmoothingEnabled = true; ux.imageSmoothingQuality = 'high';
  ux.drawImage(n, 0, 0, gw * cell, gh * cell);
  const d = ux.getImageData(0, 0, w, h).data, out = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) out[i] = d[i * 4] / 255;
  return out;
}

/**
 * Threshold a coverage canvas solid with a rough edge. For `mass`, a riso solid
 * is never even: the drum's mesh speckles it and the pressure varies in soft
 * blotches, so pixels drop out at a rate set by a low-frequency mottle.
 */
function solidify(cover, rng, dpr, speckle) {
  const w = cover.width, h = cover.height, ctx2 = cover.getContext('2d');
  const img = ctx2.getImageData(0, 0, w, h), d = img.data;
  const mottle = speckle ? mottleField(w, h, Math.round(9 * dpr), rng) : null;
  for (let i = 0; i < w * h; i++) {
    const a = d[i * 4 + 3] / 255;
    let on = a > 0.5 + (rng() - 0.5) * 0.45;
    if (on && speckle) on = rng() > speckle * (0.15 + 0.85 * Math.pow(mottle[i], 2.2));
    d[i * 4 + 3] = on ? 255 : 0;
  }
  ctx2.putImageData(img, 0, 0);
  return cover;
}

/** Fewer, smaller flecks than the kit's starve(), scaled to the device pixel. */
function starveAt(g, rng, dpr, density) {
  g.save();
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = 'destination-out';
  const w = g.canvas.width, h = g.canvas.height, n = Math.round(w * h / 1080 * density);
  for (let i = 0; i < n; i++) {
    g.globalAlpha = 0.25 + rng() * 0.6;
    g.beginPath();
    g.arc(rng() * w, rng() * h, (0.35 + rng() * 0.9) * dpr, 0, TAU);
    g.fill();
  }
  g.restore();
}

/**
 * Bake one asset at an exact pixel size: every plate's tone screened and its
 * mass and line made solid, tinted, offset by the plate's registration and
 * multiplied onto white; then the white is made transparent for the site.
 */
function bakeAsset(id, size, dpr, paperColour) {
  const a = ASSETS[id], [cw, ch] = a.sizes[size];
  const pw = Math.round(cw * dpr), ph = Math.round(ch * dpr), kx = pw / a.w, ky = ph / a.h;
  const out = cv(pw, ph), o = out.getContext('2d');
  o.fillStyle = paperColour || '#fff';
  o.fillRect(0, 0, pw, ph);
  const pitch = PITCH_CSS * dpr;
  for (const ink of a.inks) {
    const plate = cv(pw, ph), px = plate.getContext('2d');
    for (const pass of ['tone', 'mass', 'line']) {
      const cover = cv(pw, ph), g = cover.getContext('2d');
      g.setTransform(kx, 0, 0, ky, 0, 0);
      g.fillStyle = g.strokeStyle = '#000';
      g.lineCap = 'round'; g.lineJoin = 'round';
      g.save();
      a.draw(g, ink, rngFor(id + ':' + ink + ':' + pass), rngFor(id + ':shape'), pass);
      g.restore();
      const voids = rngFor(id + ':' + ink + ':' + pass + ':void');
      const layer = pass === 'tone'
        ? (starveAt(g, voids, dpr, 0.9), screenCoverage(cover, ink, pitch))
        : (starveAt(g, voids, dpr, pass === 'mass' ? 1.4 : 0.25), solidify(cover, rngFor(id + ':' + ink + ':' + pass + ':edge'), dpr, pass === 'mass' ? (a.speckle ?? 0.42) : 0));
      px.drawImage(layer, 0, 0);
    }
    px.globalCompositeOperation = 'source-in';
    px.fillStyle = INK[ink];
    px.fillRect(0, 0, pw, ph);
    const [rx, ry] = REG[ink];
    o.save();
    o.globalCompositeOperation = 'multiply';
    o.drawImage(plate, Math.round(rx * dpr), Math.round(ry * dpr));
    o.restore();
  }
  if (!paperColour) whiteToAlpha(out);
  return out;
}

/**
 * Turn the white paper transparent (colour-to-alpha against white): the result
 * over white is the print exactly, and over the site's paper it prints the
 * same inks without needing a blend mode.
 */
function whiteToAlpha(c) {
  const x = c.getContext('2d'), img = x.getImageData(0, 0, c.width, c.height), d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const a = Math.max(255 - d[i], 255 - d[i + 1], 255 - d[i + 2]) / 255;
    if (a === 0) { d[i + 3] = 0; continue; }
    for (let k = 0; k < 3; k++) d[i + k] = Math.round((d[i + k] - 255 * (1 - a)) / a);
    d[i + 3] = Math.round(a * 255);
  }
  x.putImageData(img, 0, 0);
}
// ART END

const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const params = new URLSearchParams(location.search);

function render() {
  const id = params.get('asset');
  if (id) {
    const dpr = Number(params.get('dpr') || 2), size = params.get('size') || Object.keys(ASSETS[id].sizes)[0];
    const img = bakeAsset(id, size, dpr);
    canvas.width = img.width; canvas.height = img.height;
    canvas.style.width = img.width / dpr + 'px';
    ctx.drawImage(img, 0, 0);
    return;
  }
  // Proof sheet: every asset at every size, at 2x, on paper
  const dpr = 2, pad = 24 * dpr, items = [];
  for (const [aid, a] of Object.entries(ASSETS)) for (const size of Object.keys(a.sizes)) items.push(bakeAsset(aid, size, dpr, PAPER));
  const width = 900 * dpr;
  let x = pad, y = pad, rowH = 0;
  const pos = items.map((im) => {
    if (x + im.width > width - pad) { x = pad; y += rowH + pad; rowH = 0; }
    const at = [x, y]; x += im.width + pad; rowH = Math.max(rowH, im.height); return at;
  });
  canvas.width = width; canvas.height = y + rowH + pad;
  canvas.style.width = width / dpr + 'px';
  ctx.fillStyle = '#e7e1d5'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  items.forEach((im, i) => ctx.drawImage(im, pos[i][0], pos[i][1]));
}

window.__riso = {
  duration: 1, ready: false, seek: () => render(),
  assets: Object.fromEntries(Object.entries(ASSETS).map(([id, a]) => [id, a.sizes])),
  bake: (id, size, dpr) => bakeAsset(id, size, dpr).toDataURL('image/png'),
};
render();
window.__riso.ready = true;
</script></html>
